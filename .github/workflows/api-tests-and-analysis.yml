name: API Tests and Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PROJECT_FOLDER: "RabbitMqProductAPI"
      PROJECT_NAME: "RabbitMqProductAPI"
      DOTNET_VERSION: "6.0.419"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: ${{ env.PROJECT_FOLDER }}
        run: dotnet restore

      - name: Run Tests
        working-directory: ${{ env.PROJECT_FOLDER }}
        run: |
          # Ensure TestResults directory exists
          mkdir -p "$(pwd)/TestResults"
          
          # Run tests with explicit configuration
          dotnet test \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory "$(pwd)/TestResults" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="$(pwd)/TestResults/coverage.opencover.xml"
          
          # List files to verify output
          ls -la "$(pwd)/TestResults"

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/${{ env.PROJECT_FOLDER }}/TestResults/**/*.trx
            ${{ github.workspace }}/${{ env.PROJECT_FOLDER }}/TestResults/**/coverage.opencover.xml

      - name: Download Test Results
        uses: actions/download-artifact@v3
        with:
          name: test-results
          path: ${{ env.PROJECT_FOLDER }}/TestResults

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            ${{ env.PROJECT_FOLDER }}/TestResults/*.trx
